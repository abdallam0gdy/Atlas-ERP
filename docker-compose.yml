services:
  # ============================================================
  # 1. PostgreSQL Database Engine
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: atlas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-atlas_erp_local}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      TZ: Africa/Cairo
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Initial database seed on fresh installation
      - ./server/backups/atlas_clean_initial.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_erp_local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================
  # 2. Node.js Backend API
  # ============================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: atlas_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      TZ: Africa/Cairo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-atlas_erp_local}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_POOL_MIN: 2
      DB_POOL_MAX: 30
      JWT_SECRET: ${JWT_SECRET:-atlas_erp_secret_key_prod_2026_change_in_production}
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/backups:/app/backups
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5000:5000"

  # ============================================================
  # 3. React Frontend & Nginx Reverse Proxy
  # ============================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: atlas_client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      TZ: Africa/Cairo
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
